name: OLIVA quality
description: Validate the independent offline Bible application.
runs:
  using: composite
  steps:
    - name: Resolve the standalone project
      shell: bash
      run: |
        python3 - <<'PYTHON'
        import os
        from pathlib import Path
        project = str(Path(os.environ["GITHUB_ACTION_PATH"]).resolve().parents[2])
        with open(os.environ["GITHUB_ENV"], "a") as output:
            output.write("OLIVA_PROJECT=" + project + "\n")
        PYTHON
    # Official v7.1.0; the action runtime itself uses Node 24.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: ${{ env.OLIVA_PROJECT }}/package-lock.json
    # Official v7.1.0.
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: "3.12"
    - name: Install locked packages
      shell: bash
      working-directory: ${{ env.OLIVA_PROJECT }}
      run: npm ci
    - name: Check dependency advisories
      shell: bash
      working-directory: ${{ env.OLIVA_PROJECT }}
      run: npm audit --audit-level=moderate
    - name: Validate public-domain corpus and art provenance
      shell: bash
      working-directory: ${{ env.OLIVA_PROJECT }}
      run: |
        npm run content:check
        npm run content:art
        npm run content:tree
        npm run content:swords
    - name: Types and domain/persistence tests
      shell: bash
      working-directory: ${{ env.OLIVA_PROJECT }}
      run: |
        npm run typecheck
        npm test -- --reporter=json --outputFile=docs/evidence/latest/unit-results.json
    - name: Build the web application and complete offline package
      shell: bash
      working-directory: ${{ env.OLIVA_PROJECT }}
      run: npm run build
    - name: Install test browser
      shell: bash
      working-directory: ${{ env.OLIVA_PROJECT }}
      run: npx playwright install --with-deps chromium
    - name: Test real browser flows
      shell: bash
      working-directory: ${{ env.OLIVA_PROJECT }}
      run: npm run test:e2e
    # Official v7.0.2.
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: oliva-quality-${{ github.sha }}
        retention-days: 14
        path: |
          ${{ env.OLIVA_PROJECT }}/docs/evidence/latest/
          ${{ env.OLIVA_PROJECT }}/test-results/
