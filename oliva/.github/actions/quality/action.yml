name: OLIVA quality
description: Validate the independent offline Bible application.
runs:
  using: composite
  steps:
    - name: Resolve the standalone project
      shell: bash
      run: |
        python3 - <<'PYTHON'
        import os
        from pathlib import Path
        project = str(Path(os.environ["GITHUB_ACTION_PATH"]).resolve().parents[2])
        with open(os.environ["GITHUB_ENV"], "a") as output:
            output.write("OLIVA_PROJECT=" + project + "\n")
        PYTHON
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: ${{ env.OLIVA_PROJECT }}/package-lock.json
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: "3.12"
    - name: Install locked packages
      shell: bash
      working-directory: ${{ env.OLIVA_PROJECT }}
      run: npm ci
    - name: Validate public-domain corpus and art provenance
      shell: bash
      working-directory: ${{ env.OLIVA_PROJECT }}
      run: |
        npm run content:check
        npm run content:art
        npm run content:tree
        npm run content:swords
    - name: Types and domain/persistence tests
      shell: bash
      working-directory: ${{ env.OLIVA_PROJECT }}
      run: |
        npm run typecheck
        npm test -- --reporter=json --outputFile=docs/evidence/unit-results.json
    - name: Build the web application and complete offline package
      shell: bash
      working-directory: ${{ env.OLIVA_PROJECT }}
      run: npm run build
    - name: Install test browser
      shell: bash
      working-directory: ${{ env.OLIVA_PROJECT }}
      run: npx playwright install --with-deps chromium
    - name: Test real browser flows
      shell: bash
      working-directory: ${{ env.OLIVA_PROJECT }}
      run: npm run test:e2e
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: oliva-quality-${{ github.sha }}
        retention-days: 14
        path: |
          ${{ env.OLIVA_PROJECT }}/docs/evidence/unit-results.json
          ${{ env.OLIVA_PROJECT }}/docs/evidence/e2e-results.json
          ${{ env.OLIVA_PROJECT }}/test-results/
