<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1850" viewBox="0 0 900 1850"><title>OLIVA · Bestehende Bildwelt</title><rect width="100%" height="100%" fill="#f8f7f2"/><g font-family="system-ui,sans-serif" fill="#263c30"><text x="35" y="54" font-size="31">OLIVA · Geschichten und Bildwelt</text><a href="index.svg"><text text-decoration="underline" x="35" y="88" font-size="16">Zu den mobilen Vergleichen</text></a><text x="35" y="126" font-size="17">Vorhandene Motive im echten Browser. Aufnahmen öffnen das Originalbild.</text><text x="35" y="180" font-size="15">Da gedachte Gott an Noah</text><a href="art-images/NS-0006-390-dark-art.png"><image href="art-images/NS-0006-390-dark-art.png" x="35" y="204" width="395" height="270" preserveAspectRatio="xMinYMin meet"/></a><text x="460" y="180" font-size="15">Abram glaubte dem HERRN</text><a href="art-images/NS-0010-390-dark-art.png"><image href="art-images/NS-0010-390-dark-art.png" x="460" y="204" width="395" height="270" preserveAspectRatio="xMinYMin meet"/></a><text x="35" y="570" font-size="15">Der Streit ist des HERRN</text><a href="art-images/NS-0052-390-dark-art.png"><image href="art-images/NS-0052-390-dark-art.png" x="35" y="594" width="395" height="270" preserveAspectRatio="xMinYMin meet"/></a><text x="460" y="570" font-size="15">Schweig und verstumme</text><a href="art-images/NS-0203-390-dark-art.png"><image href="art-images/NS-0203-390-dark-art.png" x="460" y="594" width="395" height="270" preserveAspectRatio="xMinYMin meet"/></a><text x="35" y="960" font-size="15">Sie fürchteten sich</text><a href="art-images/NS-0235-390-dark-art.png"><image href="art-images/NS-0235-390-dark-art.png" x="35" y="984" width="395" height="270" preserveAspectRatio="xMinYMin meet"/></a><text x="460" y="960" font-size="15">In der Krippe</text><a href="art-images/NS-0241-390-dark-art.png"><image href="art-images/NS-0241-390-dark-art.png" x="460" y="984" width="395" height="270" preserveAspectRatio="xMinYMin meet"/></a><text x="35" y="1350" font-size="15">Der HERR ist mein Hirte</text><a href="art-images/NS-0073-390-dark.png"><image href="art-images/NS-0073-390-dark.png" x="35" y="1374" width="145" height="314" preserveAspectRatio="xMinYMin meet"/></a><text x="460" y="1350" font-size="15">Ich schäme mich des Evangeliums nicht</text><a href="art-images/NS-0349-390-dark.png"><image href="art-images/NS-0349-390-dark.png" x="460" y="1374" width="145" height="314" preserveAspectRatio="xMinYMin meet"/></a></g></svg>
