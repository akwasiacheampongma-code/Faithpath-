name: AT Source Integrity (read-only)
on:
  push:
    branches:
      - content/at-source-recovery-20261018
    paths:
      - 'content/at-source-recovery/**'
      - 'scripts/audit-at-source.mjs'
      - '.github/workflows/at-source-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Verify all original AT data and draft chapter mapping
        run: |
          node scripts/audit-at-source.mjs
          node scripts/audit-at-verses.mjs
