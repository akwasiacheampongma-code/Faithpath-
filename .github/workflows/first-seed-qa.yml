name: First seed read-only browser QA
on:
  push:
    branches: [feature/ux-first-seed-living-tree-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-nt-import.txt
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm test
      - run: npm run lint -- --max-warnings 5
      - run: npm run check:contracts
      - run: npm run check:modules
      - run: npm run build
      - name: Build unchanged MAINT1 control
        if: matrix.engine == 'webkit'
        run: |
          mkdir -p /tmp/faithpath-maint1
          git archive 7d4441caf5112c04b8b6af7ddec8c4ee49d0c63a | tar -x -C /tmp/faithpath-maint1
          cd /tmp/faithpath-maint1
          FAITHPATH_OUT=/tmp/faithpath-maint1-build FAITHPATH_BUILD_COMMIT=7d4441caf5112c04b8b6af7ddec8c4ee49d0c63a FAITHPATH_BUILD_BRANCH=maintenance/stability-phase7-20261018 node scripts/build.mjs
      - name: WebKit offline control experiment
        if: matrix.engine == 'webkit'
        env:
          QA_ENGINE: webkit
          QA_URL: http://127.0.0.1:4585
          QA_BASELINE_URL: http://127.0.0.1:4587
          QA_OUT: qa-output/first-seed/webkit-control
        run: |
          PORT=4585 node scripts/serve.mjs dist > /tmp/faithpath-qa-server.log 2>&1 &
          PORT=4587 node scripts/serve.mjs /tmp/faithpath-maint1-build > /tmp/faithpath-maint1-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4587/ > /dev/null && break || sleep 1; done
          node tests/first-seed/webkit-offline-probe.mjs
      - name: Real first personal story in selected engine
        if: success() || failure()
        env:
          QA_ENGINE: ${{ matrix.engine }}
          QA_URL: http://127.0.0.1:4585
          QA_OUT: qa-output/first-seed/ci-${{ matrix.engine }}
          PORT: 4585
        run: |
          if ! curl -fsS http://127.0.0.1:4585/ > /dev/null; then node scripts/serve.mjs dist > /tmp/faithpath-qa-server.log 2>&1 & fi
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4585/ > /dev/null && break || sleep 1; done
          node tests/first-seed/flow.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: first-seed-${{ matrix.engine }}-${{ github.sha }}
          path: qa-output/first-seed
          retention-days: 14
