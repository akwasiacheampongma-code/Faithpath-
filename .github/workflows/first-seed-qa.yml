name: First seed read-only browser QA
on:
  push:
    branches: [feature/ux-first-seed-living-tree-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-nt-import.txt
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm test
      - run: npm run lint -- --max-warnings 5
      - run: npm run check:contracts
      - run: npm run check:modules
      - run: npm run build
      - name: Real first personal story in selected engine
        env:
          QA_ENGINE: ${{ matrix.engine }}
          QA_URL: http://127.0.0.1:4585
          QA_OUT: qa-output/first-seed/ci-${{ matrix.engine }}
          PORT: 4585
        run: |
          node scripts/serve.mjs dist > /tmp/faithpath-qa-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4585/ > /dev/null && break || sleep 1; done
          node tests/first-seed/flow.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: first-seed-${{ matrix.engine }}-${{ github.sha }}
          path: qa-output/first-seed
          retention-days: 14
