name: OLIVA quality
on:
  push:
    branches: [feature/oliva-next-v02-20261106]
    paths:
      - "oliva/app/**"
      - "oliva/src/**"
      - "oliva/tests/**"
      - "oliva/scripts/**"
      - "oliva/assets/**"
      - "oliva/art/**"
      - "oliva/content/**"
      - "oliva/package*.json"
      - "oliva/app.json"
      - "oliva/tsconfig.json"
      - "oliva/expo-env.d.ts"
      - "oliva/*.config.*"
      - "oliva/.github/**"
      - ".github/workflows/oliva-quality.yml"
  pull_request:
    paths: ["oliva/**", ".github/workflows/oliva-quality.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oliva-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: oliva
      - uses: ./oliva/.github/actions/quality
