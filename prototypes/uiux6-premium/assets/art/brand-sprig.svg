      <use href="#leaf-silver" transform="translate(1 -10) rotate(-68) scale(.49)"/>
      <use href="#leaf-olive" transform="translate(2 -18) rotate(65) scale(.57)"/>
      <use href="#leaf-olive" transform="translate(1 -29) rotate(-49) scale(.57)"/>
      <use href="#leaf-silver" transform="translate(1 -39) rotate(51) scale(.48)"/>
      <use href="#leaf-silver" transform="translate(2 -49) rotate(-42) scale(.5)"/>
      <use href="#leaf-olive" transform="translate(3 -59) rotate(38) scale(.45)"/>
      <use href="#leaf-olive" transform="translate(4 -66) rotate(9) scale(.52)"/>
    </g>
    <g id="sprig-c">
      <path d="M0 0C-6-19-5-39-12-60" fill="none" stroke="#526b55" stroke-width="1.6" stroke-linecap="round"/>
      <use href="#leaf-olive" transform="translate(-3 -11) rotate(-69) scale(.59)"/>
      <use href="#leaf-silver" transform="translate(-4 -22) rotate(47) scale(.48)"/>
      <use href="#leaf-silver" transform="translate(-7 -35) rotate(-59) scale(.57)"/>
      <use href="#leaf-olive" transform="translate(-9 -44) rotate(37) scale(.52)"/>
      <use href="#leaf-olive" transform="translate(-11 -54) rotate(-21) scale(.59)"/>
    </g>
  </defs>
  <!-- A single original branch, drawn as a quiet editorial brand mark. -->
  <g>
    <path d="M35 133C66 117 100 98 127 61C142 41 156 33 173 27" fill="none" stroke="#526b55" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>    <use href="#leaf-olive" transform="translate(64 117) rotate(-70) scale(.82)"/>
    <use href="#leaf-silver" transform="translate(78 109) rotate(8) scale(.87)"/>
    <use href="#leaf-silver" transform="translate(98 92) rotate(-76) scale(.9)"/>
