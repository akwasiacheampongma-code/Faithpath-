<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 160" role="img" aria-labelledby="art-title art-desc">
  <title id="art-title">Olivenzweig</title>
  <desc id="art-desc">Ein einzelner, fein gezeichneter Olivenzweig für die Faithpath Gestaltung.</desc>
  <metadata>Faithpath Phase 6A.2. Original vector geometry authored in the Codex session on 2026-10-17. No third-party imagery, traced artwork, external fonts, or image-model output.</metadata>
  <defs>
    <!-- Lanceolate olive leaves: original contours and engraved midribs. -->
    <g id="leaf-olive">
      <path d="M0 0C-9-10-10-27 0-44C9-32 11-12 0 0Z" fill="#526b55"/>
      <path d="M0-3C-1-15-1-27 0-39" fill="none" stroke="#b8aa7d" stroke-width=".85" opacity=".8"/>
    </g>
    <g id="leaf-silver">
      <path d="M0 0C-8-9-10-29 1-43C9-29 9-11 0 0Z" fill="#8b9b72"/>
      <path d="M0-3 1-38" fill="none" stroke="#526b55" stroke-width=".75" opacity=".65"/>
    </g>
    <g id="sprig-a">
      <path d="M0 0C-2-20 3-41-3-65" fill="none" stroke="#526b55" stroke-width="1.6" stroke-linecap="round"/>
      <use href="#leaf-olive" transform="translate(0 -12) rotate(-58) scale(.54)"/>
      <use href="#leaf-silver" transform="translate(0 -22) rotate(57) scale(.56)"/>
      <use href="#leaf-silver" transform="translate(0 -35) rotate(-48) scale(.48)"/>
      <use href="#leaf-olive" transform="translate(-1 -45) rotate(42) scale(.49)"/>
      <use href="#leaf-olive" transform="translate(-2 -57) rotate(-11) scale(.57)"/>
    </g>
    <g id="sprig-b">
