name:     .github/workflows/import-faithpath.yml

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: FaithPath ZIP entpacken
        shell: bash
        run: |
          set -euo pipefail
          archive="FaithPath-V4-F-GitHub.zip"
          test -f "$archive"
          mkdir -p .faithpath-import
          unzip -q "$archive" -d .faithpath-import
          test -f .faithpath-import/FaithPath/package.json
          test -f .faithpath-import/FaithPath/index.html

          # Die ZIP enthält den vollständigen Stand. Der temporäre Importordner,
          # die ZIP und .git bleiben erhalten, bis die neuen Dateien kopiert sind.
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .faithpath-import \
            ! -name "$archive" \
            -exec rm -rf {} +
          cp -a .faithpath-import/FaithPath/. .
          rm -rf .faithpath-import "$archive"

      - name: FaithPath V4 committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Änderungen zu committen."
          else
            git commit -m "Import FaithPath V4 F source"
            git push
          fi
